<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeeshTV Browser</title>
<style>
  @font-face { font-family: "Schibsted"; src: url("fonts/SchibstedGrotesk.ttf"); font-weight: 100 900; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #1c1c22 0%, #0b0b0d 70%);
    color: #f5f5f5; font-family: "Schibsted", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  h1 { font-size: 64px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
  h1 span { color: #ffc21a; }
  .sub { font-size: 15px; font-weight: 600; letter-spacing: 0.5em; color: #a8a8ae; margin: 10px 0 56px; }
  .keys { display: grid; grid-template-columns: auto auto; gap: 14px 28px; font-size: 19px; color: #d8d8dc; }
  .key { justify-self: end; font-weight: 700; color: #fff; background: rgba(255,255,255,.12);
         border-radius: 10px; padding: 4px 14px; }
</style>
</head>
<body>
  <h1>Beesh<span>TV</span></h1>
  <div class="sub">BROWSER</div>
  <div class="keys">
    <div class="key">Menu ☰</div><div>Address bar: search, type or say a site</div>
    <div class="key">Arrows</div><div>Move the pointer (hold to go faster)</div>
    <div class="key">OK</div><div>Click (hold for a long press)</div>
    <div class="key">Edges</div><div>Push the pointer past an edge to scroll</div>
    <div class="key">Back</div><div>Previous page</div>
  </div>
</body>
</html>
